
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>butstrep</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid px-0 min-vh-100 d-flex flex-column">
        <nav class="navbar navbar-expand-sm bg-success navbar-dark">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Bantuan</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="bg-white flex-grow-1 d-flex justify-content-center align-items-center p-3">
            <div class="card bg-white shadow border-0 w-100" style="max-width: 376px;">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold text-dark">Masuk ke Ruang Baca</h4>
                        <p class="text-secondary small mb-0">Temukan bacaan untuk hari ini.</p>
                    </div>

                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label small text-dark">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small text-dark">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small" for="remember">Ingat saya</label>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Masuk</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center py-3">
                    <a href="#" class="link-success small">Lupa password?</a>
                </div>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
